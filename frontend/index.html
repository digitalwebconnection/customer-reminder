<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Private Customer Follow-up & Call Reminder System with scheduled browser and email alerts." />
    <meta name="theme-color" content="#08090d" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RemindIQ" />
    <meta name="format-detection" content="telephone=no" />
    <title>RemindIQ — Customer Follow-up & Call Reminder System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- OneSignal Web Push SDK v16 (Domain Protected & Exception Guarded) -->
    <script>
      // Global error shield: Prevent OneSignal non-production domain errors from halting React or data loading
      window.addEventListener('unhandledrejection', function(event) {
        const errStr = (event?.reason && (event.reason.message || event.reason.stack || String(event.reason))) || '';
        if (errStr.includes('digitalwebconnection.com') || errStr.includes('OneSignal')) {
          event.preventDefault();
          console.info('[OneSignal] Suppressed domain mismatch notice for non-production environment.');
        }
      });

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          const isProd =
            window.location.hostname === 'digitalwebconnection.com' ||
            window.location.hostname.endsWith('.digitalwebconnection.com') ||
            window.location.hostname.endsWith('.vercel.app');

          if (isProd) {
            await OneSignal.init({
              appId: "c211ef15-5ef5-45a5-80ce-e6f36c3fe58a",
              allowLocalhostAsSecureOrigin: false,
            });
          } else {
            console.info('[OneSignal] Skipping OneSignal initialization on local domain (' + window.location.hostname + '). Standard browser notifications and audio chimes are active.');
          }
        } catch (err) {
          console.info('[OneSignal] Push initialization handled gracefully:', err?.message || err);
        }
      });
    </script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  </head>
  <body class="bg-[#08090d] text-slate-800 min-h-screen antialiased selection:bg-amber-100 selection:text-amber-900">
    <div id="root">
      <!-- High-Performance Instant Native Glass Splash Screen for Mobile & Desktop -->
      <div id="remindiq-app-splash" style="position:fixed;inset:0;background:#08090d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden;">
        <!-- Ambient Caustic Glows in Background -->
        <div style="position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,0.18) 0%,rgba(245,158,11,0) 70%);top:33%;left:50%;transform:translate(-50%,-50%);filter:blur(40px);pointer-events:none;animation:remindiq-glow 3s ease-in-out infinite alternate;"></div>
        <div style="position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,0.14) 0%,rgba(56,189,248,0) 70%);bottom:25%;right:20%;filter:blur(50px);pointer-events:none;"></div>

        <!-- Center Round Glass Capsule with Logo -->
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;">
          <!-- Circular Glass Orb -->
          <div style="position:relative;width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,0.18) 0%,rgba(255,255,255,0.05) 100%);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.22);box-shadow:0 20px 50px rgba(0,0,0,0.65),inset 0 1px 2px rgba(255,255,255,0.45),0 0 35px rgba(245,158,11,0.22);display:flex;align-items:center;justify-content:center;animation:remindiq-float 3s ease-in-out infinite alternate;">
            <!-- Inner Glass Ring -->
            <div style="position:absolute;inset:2px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);pointer-events:none;"></div>
            <!-- Logo Icon -->
            <img src="/remindiq-logo-icon.png" alt="RemindIQ" style="width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.4));" />
          </div>

          <!-- Brand Text & Micro-Loader -->
          <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
            <div style="display:flex;align-items:center;gap:4px;">
              <span style="font-size:20px;font-weight:900;letter-spacing:-0.5px;color:#ffffff;">REMIND</span>
              <span style="font-size:20px;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(135deg,#f59e0b,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">IQ</span>
            </div>

            <!-- Sleek Glass Pill Loader -->
            <div style="display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:9999px;background:rgba(255,255,255,0.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);box-shadow:0 4px 15px rgba(0,0,0,0.3);">
              <div style="width:13px;height:13px;border:2px solid rgba(245,158,11,0.3);border-top-color:#f59e0b;border-radius:50%;animation:remindiq-spin 0.8s linear infinite;"></div>
              <span style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.75);letter-spacing:0.2px;">Loading Workspace...</span>
            </div>
          </div>
        </div>

        <style>
          @keyframes remindiq-float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-6px) scale(1.02); }
          }
          @keyframes remindiq-glow {
            0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
          }
          @keyframes remindiq-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
