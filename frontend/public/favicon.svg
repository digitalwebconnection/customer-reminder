<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Bell Fill Gradient -->
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Red Alert Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.4" />
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#e11d48" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Bell Shape with shadow -->
  <g filter="url(#shadow)">
    <!-- Top hanger loop -->
    <path d="M29 15.5 C29 13.8 30.3 12.5 32 12.5 C33.7 12.5 35 13.8 35 15.5" stroke="url(#bellGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Main Bell Body -->
    <path d="M32 17 C25.5 17 21 22 21 30.5 C21 36.5 18 38.5 17 40.5 C16.5 41.5 17.2 42.5 18.4 42.5 L45.6 42.5 C46.8 42.5 47.5 41.5 47 40.5 C46 38.5 43 36.5 43 30.5 C43 22 38.5 17 32 17 Z" fill="url(#bellGrad)" />

    <!-- Bell Clapper -->
    <path d="M28 43.5 C28.5 46.8 30 48.5 32 48.5 C34 48.5 35.5 46.8 36 43.5 Z" fill="#c7d2fe" />

    <!-- Bell Acoustic Ring Waves -->
    <path d="M12 26 C10.5 28.5 10.5 32.5 12 35" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path d="M52 26 C53.5 28.5 53.5 32.5 52 35" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Notification Badge Indicator (Top Right Vibrant Alert Dot) -->
  <g filter="url(#badgeShadow)">
    <circle cx="47" cy="15" r="7.5" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="47" cy="15" r="2.5" fill="#ffffff" />
  </g>
</svg>