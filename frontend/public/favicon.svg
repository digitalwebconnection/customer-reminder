<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Main Lower Shard Gradient -->
    <linearGradient id="favShardBottom" x1="15%" y1="90%" x2="85%" y2="20%">
      <stop offset="0%" stopColor="#FF3B30" />
      <stop offset="35%" stopColor="#FF5252" />
      <stop offset="70%" stopColor="#E91E63" />
      <stop offset="100%" stopColor="#D81B60" />
    </linearGradient>

    <!-- Top Medium Shard Gradient -->
    <linearGradient id="favShardTop" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stopColor="#4A148C" />
      <stop offset="50%" stopColor="#7B1FA2" />
      <stop offset="100%" stopColor="#AB47BC" />
    </linearGradient>

    <!-- Right Small Shard Gradient -->
    <linearGradient id="favShardRight" x1="10%" y1="85%" x2="90%" y2="15%">
      <stop offset="0%" stopColor="#880E4F" />
      <stop offset="50%" stopColor="#C2185B" />
      <stop offset="100%" stopColor="#E91E63" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" floodColor="#E11D48" floodOpacity="0.25" />
    </filter>
  </defs>

  <!-- Background subtle sail facet -->
  <path d="M30 92 L86 10 L70 36 Z" fill="#0F172A" fillOpacity="0.04" />

  <!-- The 3 Shards Logo Icon -->
  <g filter="url(#favGlow)">
    <!-- 1. Bottom Main Shard -->
    <path d="M 20 68 Q 28 52 48 45 L 75 44 C 65 62 48 78 39 88 Q 33 77 20 68 Z" fill="url(#favShardBottom)" />
    <!-- 2. Top Medium Shard -->
    <path d="M 34 44 L 54 20 L 68 33 C 58 39 46 44 34 44 Z" fill="url(#favShardTop)" />
    <!-- 3. Small Right Shard -->
    <path d="M 74 38 L 89 37 L 82 49 C 79 45 76 41 74 38 Z" fill="url(#favShardRight)" />
  </g>
</svg>